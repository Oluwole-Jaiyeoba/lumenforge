name: portability

# Runs without SGLang, torch or a GPU.  Proves that:
#  - portable packages work with SGLang absent,
#  - package boundaries hold (tests/architecture),
#  - the gateway/driver refactor is behavior-identical (golden tests),
#  - every registered SGLang adapter passes the static surface check against
#    the SGLang release(s) it claims to support (downloaded as wheels, not installed).

on:
  push:
  pull_request:

jobs:
  portable-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install workspace (no SGLang)
        run: |
          python -m pip install --upgrade pip pytest
          INSTALL_SGLANG_TESTBED=1 bash scripts/install_workspace.sh
      - name: Verify SGLang is NOT installed
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('sglang') is not None)"
      - name: Run all checks
        run: bash scripts/check_portability.sh

  sglang-surface:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sglang: ["0.5.10.post1", "0.5.11", "0.5.12.post1", "0.5.13", "0.5.15.post1", "0.5.16", "0.5.18", "0.5.20"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install adapter package only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/agentic-core -e packages/agentic-backend-api -e packages/agentic-backend-sglang
      - name: Download and unpack SGLang wheel (no dependencies, not installed)
        run: |
          python -m pip download "sglang==${{ matrix.sglang }}" --no-deps -d /tmp/wheel
          mkdir -p /tmp/sglang-src && python -m zipfile -e /tmp/wheel/*.whl /tmp/sglang-src
      - name: Static surface check (adapter chosen by version)
        run: python -m agentic_backends.sglang.surface --sglang-src /tmp/sglang-src
