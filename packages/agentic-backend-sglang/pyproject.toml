[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-backend-sglang"
version = "0.1.0"
description = "SGLang integration: versioned adapters, surface checks, request lowering, tracing."
requires-python = ">=3.10"
readme = {text = "Everything that knows SGLang internals lives here. See README_RESTRUCTURING.md.", content-type = "text/markdown"}
# SGLang itself is NOT a dependency: the static surface check, lowering and
# selection work without it.  The server venv installs SGLang separately
# (sglang_direct_kv/requirements.txt pins the tested version).
dependencies = [
  "agentic-core>=0.1.0",
  "agentic-backend-api>=0.1.0",
]

[project.scripts]
agentic-sglang-surface = "agentic_backends.sglang.surface:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentic_backends*"]
namespaces = true
