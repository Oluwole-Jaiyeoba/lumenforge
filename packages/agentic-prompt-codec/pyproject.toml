[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-prompt-codec"
version = "0.1.0"
description = "Lossless modular prompt shorthand for agentic workloads."
requires-python = ">=3.10"
readme = {text = "Rule-based prompt codecs, validation, token accounting, and reports.", content-type = "text/markdown"}
dependencies = []

[project.optional-dependencies]
tokenizers = ["transformers>=4.45,<6", "jinja2>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]
