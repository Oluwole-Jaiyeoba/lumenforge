[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-instrumentation"
version = "0.1.0"
description = "Backend-neutral instrumentation catalog and evidence checks for agentic research lanes."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
