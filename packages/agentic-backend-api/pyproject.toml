[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-backend-api"
version = "0.1.0"
description = "Portable capability and command interface for inference backends."
requires-python = ">=3.10"
readme = {text = "Backend capability, command-result, and adapter contracts.", content-type = "text/markdown"}
dependencies = ["agentic-core>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
