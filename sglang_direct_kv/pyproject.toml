[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-kv"
version = "0.1.0"
description = "Direct SGLang KV instrumentation testbed for hint-guided KV prefetching."
requires-python = ">=3.10"
dependencies = [
  "agentic-backend-api>=0.1.0",
  "agentic-backend-sglang>=0.1.0",
  "agentic-controller>=0.1.0",
  "agentic-core>=0.1.0",
  "agentic-experiments>=0.1.0",
  "agentic-gateway>=0.1.0",
  "agentic-harnesses>=0.1.0",
  "agentic-prompt-codec>=0.1.0",
  "agentic-reports>=0.1.0",
  "aiohttp>=3.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
prompt-codec = ["agentic-prompt-codec[tokenizers]>=0.1.0"]
